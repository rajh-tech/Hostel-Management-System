<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forgot password</title>
    <style>
            .site-header {
  min-height: 76px;
  padding: 14px max(24px, calc((100% - 1120px) / 2));
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  background: rgba(255,255,255,.94);
  border-bottom: 1px solid rgba(220,230,235,.9);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  font-family: 'Manrope', sans-serif;
  font-size: 1.3rem;
  font-weight: 800;
  letter-spacing: -.5px;
}

.brand-icon {
  display: grid;
  place-items: center;
  width: 39px;
  height: 39px;
  color: white;
  background: var(--primary);
  border-radius: 12px;
}
.brand-accent { color: var(--primary); }
.back-link { color: var(--primary); font-size: .92rem; font-weight: 700; }
.back-link:hover, .small-link:hover, .register-prompt a:hover { text-decoration: underline; }

        .forgot-password {
    max-width: 400px;
    margin: 80px auto;
    padding: 30px;
    background: white;
    border-radius: 12px;
    box-shadow: 0 4px 15px #00000015;
    font-family: Arial, sans-serif;
}

.forgot-password h2 {
    text-align: center;
    color: #176b87;
}

.forgot-password p {
    color: #666;
    line-height: 1.6;
}

.forgot-password label {
    display: block;
    margin: 18px 0 8px;
}

.forgot-password input {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.forgot-password button {
    width: 100%;
    padding: 12px;
    margin: 18px 0;
    background: #176b87;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}

.forgot-password a {
    color: #176b87;
    text-decoration: none;
}
    </style>
</head>
<body>
    <header class="site-header">
    <a class="brand" href="home.html"><span class="brand-icon"></span><span>Hostel<span class="brand-accent">Management</span></span></a>
    <a class="back-link" href="home.html">← Back to Home</a>
  </header>
  <br>
   <div class="forgot-password">
    <h2>Forgot Password?</h2>

    <p>
        Enter your registered email address
        to reset your password.
    </p>

    <form>
        <label for="email">Registered Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">Send Reset Link</button>
    </form>

    <p>
        Remember your password?
        <a href="login.html">Back to Login</a>
    </p>
</div> 
</body>
</html>
